[[permission]]
identifier = "allow-desktop-command-bridge"
description = "Development-only arbitrary command and PTY bridge. Never grant this to the production remote webview."
commands.allow = [
  "get_cmd_server_info",
  "execute_command",
  "execute_stream_command",
  "cancel_stream_command",
  "execute_pty_create",
  "execute_pty_input",
  "execute_pty_resize",
  "execute_pty_kill",
]
