name: Build Desktop App

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#desktop-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [prepare, verify]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Install Rust stable (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          RUSTUP_VERSION: 1.29.0
          RUSTUP_INIT_SHA256_AARCH64_APPLE_DARWIN: aeb4105778ca1bd3c6b0e75768f581c656633cd51368fa61289b6a71696ac7e1
          RUSTUP_INIT_SHA256_X86_64_APPLE_DARWIN: 33cf85df9142bc6d29cbc62fa5ca1d4c29622cddb55213a4c1a43c457fb9b2d7
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              rustup_host="aarch64-apple-darwin"
              rustup_sha256="$RUSTUP_INIT_SHA256_AARCH64_APPLE_DARWIN"
              ;;
            x86_64)
              rustup_host="x86_64-apple-darwin"
              rustup_sha256="$RUSTUP_INIT_SHA256_X86_64_APPLE_DARWIN"
              ;;
          esac
          rustup_init="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSLo "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${rustup_host}/rustup-init"
          printf '%s  %s\n' "$rustup_sha256" "$rustup_init" | shasum -a 256 -c -
          chmod +x "$rustup_init"
          "$rustup_init" -y --default-host "$rustup_host" --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add "${{ matrix.target }}"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        if: needs.prepare.outputs.version != 'dev'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package_version="$(node -p "require('./packages/desktop/package.json').version")"
          tauri_version="$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk -F'\"' '/^version = "/ { print $2; exit }' packages/desktop/src-tauri/Cargo.toml)"

          if [[ "$RELEASE_VERSION" != "$package_version" || "$RELEASE_VERSION" != "$tauri_version" || "$RELEASE_VERSION" != "$cargo_version" ]]; then
            echo "Release tag version $RELEASE_VERSION must match desktop package ($package_version), Tauri config ($tauri_version), and Cargo crate ($cargo_version)." >&2
            exit 1
          fi

      - name: Validate Apple release credentials
        if: matrix.platform == 'macos-latest' && needs.prepare.outputs.should_release == 'true'
        shell: bash
        env:
          RIFT_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RIFT_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RIFT_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RIFT_APPLE_ID: ${{ secrets.APPLE_ID }}
          RIFT_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RIFT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing_credentials=()
          [ -n "$RIFT_APPLE_CERTIFICATE" ] || missing_credentials+=(APPLE_CERTIFICATE)
          [ -n "$RIFT_APPLE_CERTIFICATE_PASSWORD" ] || missing_credentials+=(APPLE_CERTIFICATE_PASSWORD)
          [ -n "$RIFT_APPLE_SIGNING_IDENTITY" ] || missing_credentials+=(APPLE_SIGNING_IDENTITY)
          [ -n "$RIFT_APPLE_ID" ] || missing_credentials+=(APPLE_ID)
          [ -n "$RIFT_APPLE_PASSWORD" ] || missing_credentials+=(APPLE_PASSWORD)
          [ -n "$RIFT_APPLE_TEAM_ID" ] || missing_credentials+=(APPLE_TEAM_ID)

          if [ "${#missing_credentials[@]}" -gt 0 ]; then
            echo "Refusing to publish an unnotarized macOS release. Missing: ${missing_credentials[*]}" >&2
            exit 1
          fi

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping signing"
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          rm $CERTIFICATE_PATH

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}

      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          bundle_root="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app_path="$(find "$bundle_root" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$app_path" ]; then
            echo "No macOS app bundle found in $bundle_root" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Verify notarized macOS release
        if: matrix.platform == 'macos-latest' && needs.prepare.outputs.should_release == 'true'
        shell: bash
        run: |
          bundle_root="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -d --verbose=4 "$app_path" 2>&1 | grep -q 'Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  create-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.dmg" -exec cp {} release-files/ \;
          find artifacts -name "*.msi" -exec cp {} release-files/ \;
          find artifacts -name "*_x64-setup.exe" -exec cp {} release-files/ \;
          echo "Release files:"
          ls -la release-files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "RIFT Desktop $TAG_NAME" \
            --draft \
            --generate-notes \
            release-files/*
