name: Run Tests

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Verify preview source configuration
        run: node --test scripts/__tests__/release-source-config.test.cjs

      - name: Run tests with coverage
        run: pnpm test:ci

      - name: Verify checks leave source clean
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
